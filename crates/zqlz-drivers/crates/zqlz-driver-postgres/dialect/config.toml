id = "postgresql"
display_name = "PostgreSQL"
language_type = "sql"

[grammar]
type = "tree-sitter"
name = "sql"

[parser]
skip_sql_validation = false
skip_tree_sitter_errors = false
custom_validator = false

[syntax]
identifier_quote = "\""
string_quote = "'"
case_sensitive = false
statement_terminator = ";"
supports_comments = true

[syntax_highlighting]
profile = "postgresql"
grammar = "sql"
highlight_query = "postgresql"
parameter_placeholders = "sql-no-question-mark"
brackets = "tree-sitter"
command_syntax = false
document_syntax = false
sql_overlays = true
dollar_quoted_strings = true
completion_triggers = [".", " ", "(", ","]
completion_word_chars = ["$"]
indent_after_keywords = ["BEGIN", "THEN", "ELSE", "LOOP", "AS", "DECLARE"]
auto_close_pairs = ["()", "[]", "{}", "''", "\"\""]

[syntax_terms]
keywords = ["ANALYZE", "BIGSERIAL", "BYTEA", "CITEXT", "CONCURRENTLY", "DO", "ILIKE", "JSONB", "LATERAL", "MATERIALIZED", "NOTIFY", "PLPGSQL", "REINDEX", "SERIAL", "SMALLSERIAL", "TABLE", "UNLOGGED", "VACUUM"]
functions = ["ARRAY_AGG", "ARRAY_LENGTH", "BOOL_AND", "BOOL_OR", "DATE_PART", "DATE_TRUNC", "DENSE_RANK", "GENERATE_SERIES", "GEN_RANDOM_UUID", "JSON_BUILD_OBJECT", "JSONB_AGG", "JSONB_BUILD_OBJECT", "JSONB_EACH", "JSONB_OBJECT_AGG", "JSONB_SET", "NOW", "PG_STAT_STATEMENTS_RESET", "PG_TYPEOF", "REGEXP_REPLACE", "ROW_NUMBER", "SPLIT_PART", "STRING_AGG", "TO_CHAR", "TO_JSONB", "UNNEST"]
types = ["BIGSERIAL", "BYTEA", "CIDR", "CITEXT", "INET", "INTERVAL", "JSONB", "JSONPATH", "MACADDR", "MACADDR8", "MONEY", "NAME", "SERIAL", "SMALLSERIAL", "TIMESTAMPTZ", "TIMETZ", "TSQUERY", "TSVECTOR", "UUID", "XML"]

[comments]
line_comment = "--"
block_comment_start = "/*"
block_comment_end = "*/"

[syntax_quality]
text = """
CREATE TABLE "categories" (
  "category_id" text(255) NOT NULL,
  payload JSONB DEFAULT '{}'::jsonb,
  owner_id UUID REFERENCES users(id),
  amount NUMERIC(10, 2) CHECK (amount > 0),
  updated_at TIMESTAMPTZ
);
SELECT * FROM "categories", LATERAL jsonb_each(payload) AS entry
WHERE owner_id = $1 AND payload ? 'seo';
SELECT row_number() OVER (PARTITION BY owner_id ORDER BY updated_at DESC) FROM "categories";
SELECT DISTINCT CASE WHEN amount IN (10, 20) THEN amount ELSE 0 END AS bucket
FROM "categories"
NATURAL LEFT JOIN category_rollups USING (owner_id)
WINDOW recent AS (PARTITION BY owner_id ORDER BY updated_at DESC);
SELECT count(*) FILTER (WHERE amount IS NOT NULL) OVER recent FROM "categories"
UNION ALL SELECT 0 EXCEPT SELECT 1 INTERSECT SELECT 2;
WITH RECURSIVE category_tree AS (
  SELECT category_id, owner_id FROM "categories" WHERE owner_id IS NULL
  UNION ALL
  SELECT c.category_id, c.owner_id FROM "categories" c JOIN category_tree t ON c.owner_id = t.category_id
)
SELECT category_id FROM category_tree ORDER BY category_id ASC LIMIT 10 OFFSET 5;
ALTER TABLE "categories" ADD COLUMN archived_at TIMESTAMPTZ;
CREATE UNIQUE INDEX IF NOT EXISTS idx_categories_owner_unique ON "categories"(owner_id);
INSERT INTO "categories" (category_id) VALUES ('1') ON CONFLICT (category_id) DO UPDATE SET updated_at = NOW() RETURNING category_id;
TRUNCATE TABLE category_audit RESTART IDENTITY CASCADE;
GRANT SELECT ON TABLE "categories" TO app_role;
REVOKE DELETE ON TABLE "categories" FROM app_role;
REINDEX INDEX CONCURRENTLY idx_categories_owner;
"""

expected_outline = [
  "CREATE categories",
  "ALTER categories",
  "INSERT categories",
  "TRUNCATE category_audit",
]

