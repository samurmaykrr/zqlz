id = "duckdb"
display_name = "DuckDB SQL"
language_type = "sql"

[grammar]
type = "tree-sitter"
name = "sql"

[parser]
skip_sql_validation = false
skip_tree_sitter_errors = false
custom_validator = false

[syntax]
identifier_quote = "\""
string_quote = "'"
case_sensitive = false
statement_terminator = ";"
supports_comments = true

[syntax_highlighting]
profile = "duckdb"
grammar = "sql"
highlight_query = "postgresql"
parameter_placeholders = "sql-question-mark"
brackets = "tree-sitter"
command_syntax = false
document_syntax = false
sql_overlays = true
dollar_quoted_strings = false
completion_triggers = [".", " ", "(", ","]
completion_word_chars = ["$"]
indent_after_keywords = ["BEGIN", "THEN", "ELSE", "LOOP", "AS", "DECLARE"]
auto_close_pairs = ["()", "[]", "{}", "''", "\"\""]

[syntax_terms]
keywords = ["ATTACH", "COPY", "DELIMITER", "DESCRIBE", "DETACH", "EXPORT", "HEADER", "IMPORT", "INSTALL", "LOAD", "PARTITION", "PERCENT", "PIVOT", "PRAGMA", "QUALIFY", "SAMPLE", "SUMMARIZE", "UNPIVOT"]
functions = ["APPROX_COUNT_DISTINCT", "DATE_DIFF", "DATE_PART", "EPOCH_MS", "JSON_EXTRACT", "JSON_EXTRACT_STRING", "LIST", "LIST_AGG", "LIST_CONTAINS", "LIST_VALUE", "MEDIAN", "PIVOT", "READ_CSV", "READ_JSON", "READ_PARQUET", "ROW_NUMBER", "SPLIT_PART", "UNNEST"]
types = ["BOOL", "HUGEINT", "LIST", "MAP", "STRUCT", "UBIGINT", "UINTEGER", "UNION", "USMALLINT", "UTINYINT", "UUID"]

[comments]
line_comment = "--"
block_comment_start = "/*"
block_comment_end = "*/"

[syntax_quality]
text = """
INSTALL httpfs;
LOAD httpfs;
CREATE TEMP TABLE staging AS SELECT * FROM read_parquet('s3://bucket/events/*.parquet');
COPY (
  SELECT LIST_VALUE(user_id) AS ids, MEDIAN(total) AS p50
  FROM read_parquet('orders.parquet')
  QUALIFY row_number() OVER (PARTITION BY user_id ORDER BY created_at) = 1
) TO 'orders.csv' (HEADER, DELIMITER ',');
SELECT date_part('day', created_at) AS day FROM staging SAMPLE 10 PERCENT;
CREATE TABLE analytics.events (payload STRUCT(id UUID, tags LIST(TEXT)));
"""

expected_outline = [
  "INSTALL",
  "LOAD",
  "CREATE staging",
  "COPY",
  "Query",
  "CREATE analytics.events",
]

