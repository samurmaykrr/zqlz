[package]
name = "zqlz-text-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/text_editor.rs"

[features]
syntax-probe-drivers = ["dep:zqlz-drivers"]
syntax-probe-all-drivers = ["syntax-probe-drivers", "zqlz-drivers/all-drivers"]

[dependencies]
# GUI Framework
gpui.workspace = true
gpui_platform.workspace = true
zqlz-ui.workspace = true
zqlz-core.workspace = true
zqlz-drivers = { workspace = true, optional = true }

# Text buffer
ropey = "1.6"

# Syntax highlighting
tree-sitter.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-sequel.workspace = true

# LSP support
lsp-types.workspace = true

# Utilities
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex.workspace = true
chrono.workspace = true
uuid.workspace = true
convert_case.workspace = true
zqlz-internal-storage.workspace = true
sqlformat.workspace = true
sqlparser.workspace = true
url.workspace = true

# Async
futures.workspace = true

[dev-dependencies]
indoc.workspace = true
gpui = { workspace = true, features = ["test-support"] }
